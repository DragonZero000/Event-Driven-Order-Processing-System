name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        run: go test -race -count=1 ./...

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [order, inventory, payment, notification]
    steps:
      - uses: actions/checkout@v4
      - name: docker build ${{ matrix.service }}
        run: docker build -f docker/Dockerfile.${{ matrix.service }} -t ${{ matrix.service }}-service:${{ github.sha }} .
